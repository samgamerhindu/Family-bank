    // --- 3. FORMATTING & HELPERS ---
    function formatINR(amount) {
      const num = Number(amount) || 0;
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(num);
    }

    function formatTime(isoString) {
      if (!isoString) return '';
      const date = new Date(isoString);
      return date.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) +
             ' · ' +
             date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    }

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function renderAvatar(account, sizeClasses = 'w-12 h-12 text-2xl') {
      if (!account) {
        return `<div class="${sizeClasses} rounded-full bg-blue-100 flex items-center justify-center font-bold text-blue-700">?</div>`;
      }
      if (account.avatarType === 'url' && account.avatarValue) {
        const fallbackEmoji = account.isAdmin ? '👑' : '👤';
        return `
          <div class="${sizeClasses} rounded-full overflow-hidden bg-blue-100 border border-white shadow-sm flex items-center justify-center shrink-0">
            <img src="${escapeHTML(account.avatarValue)}"
                 alt="${escapeHTML(account.displayName)}"
                 class="w-full h-full object-cover"
                 onerror="this.style.display='none'; this.parentElement.innerHTML='<span>${fallbackEmoji}</span>';" />
          </div>
        `;
      }
      return `
        <div class="${sizeClasses} rounded-full bg-gradient-to-tr from-blue-100 via-sky-100 to-blue-200 border border-white shadow-sm flex items-center justify-center shrink-0 select-none">
          <span>${escapeHTML(account.avatarValue || '👤')}</span>
        </div>
      `;
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const styles = {
        success: 'bg-blue-950 text-white border-blue-500/40',
        error: 'bg-red-950 text-red-50 border-red-500/40',
        info: 'bg-blue-900 text-white border-sky-400/40'
      };
      const icons = {
        success: '✅',
        error: '⚠️',
        info: '✨'
      };

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl border backdrop-blur-md text-sm font-medium transition-all duration-300 transform translate-y-2 opacity-0 ${styles[type] || styles.info}`;
      toast.innerHTML = `
        <span class="text-base">${icons[type] || icons.info}</span>
        <span class="flex-1 leading-snug">${escapeHTML(message)}</span>
      `;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3600);
    }

    function attachRealtimeListeners() {
      if (!currentUser || !db) return;

      onSnapshot(
        getPublicDocRef('hfb_settings', 'global'),
        (snap) => {
          if (snap.exists()) {
            state.settings = { ...state.settings, ...snap.data() };
            render();
          }
        },
        (err) => console.error("Settings listener error:", err)
      );

      onSnapshot(
        getPublicCollectionRef('hfb_accounts'),
        (snapshot) => {
          snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            if (data && data.id) {
              state.accounts[data.id] = data;
            }
          });
          state.isCloudReady = true;
          render();
        },
        (err) => console.error("Accounts listener error:", err)
      );

      onSnapshot(
        getPublicCollectionRef('hfb_requests'),
        (snapshot) => {
          const items = [];
          snapshot.forEach((docSnap) => {
            items.push({ id: docSnap.id, ...docSnap.data() });
          });
          items.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
          state.requests = items;
          render();
          if (state.isNotifOpen) renderNotifDrawer();
        },
        (err) => console.error("Requests listener error:", err)
      );

      onSnapshot(
        getPublicCollectionRef('hfb_transactions'),
        (snapshot) => {
          const txs = [];
          snapshot.forEach((docSnap) => {
            txs.push({ id: docSnap.id, ...docSnap.data() });
          });
          txs.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
          state.transactions = txs;
          render();
        },
        (err) => console.error("Transactions listener error:", err)
      );

      onSnapshot(
        getPublicCollectionRef('hfb_messages'),
        (snapshot) => {
          const msgs = [];
          snapshot.forEach((docSnap) => {
            msgs.push({ id: docSnap.id, ...docSnap.data() });
          });
          msgs.sort((a, b) => new Date(a.createdAt || 0) - new Date(b.createdAt || 0));
          state.messages = msgs;
          if (state.isChatOpen) renderChatDrawer();
        },
        (err) => console.error("Messages listener error:", err)
      );
    }

    async function initFirebase() {
      if (!firebaseConfig) {
        showToast("Firebase config missing. Running offline preview.", "error");
        state.isCloudReady = true;
        render();
        return;
      }

      try {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        currentUser = auth.currentUser;
        if (!currentUser) {
          await new Promise((resolve) => {
            const unsub = onAuthStateChanged(auth, (user) => {
              if (user) {
                currentUser = user;
                unsub();
                resolve();
              }
            });
          });
        }

        await seedInitialDataIfNeeded();
        attachRealtimeListeners();
      } catch (err) {
        console.error("Firebase init failed:", err);
        showToast("Cloud connection error: " + err.message, "error");
        state.isCloudReady = true;
        render();
      }
    }

    async function saveAccountSetup(accountId, formData) {
      if (!currentUser || !db) return;
      const existingAccs = Object.values(state.accounts);
      const duplicateCard = existingAccs.find(
        a => a.id !== accountId && a.isConfigured && a.cardNumber === formData.cardNumber
      );
      if (duplicateCard) {
        showToast(`Card #${formData.cardNumber} is already assigned to ${duplicateCard.displayName}. Choose another 4-digit number.`, "error");
        return;
      }

      try {
        await updateDoc(getPublicDocRef('hfb_accounts', accountId), {
          isConfigured: true,
          displayName: formData.displayName.trim(),
          passkey: formData.passkey.trim(),
          cardNumber: formData.cardNumber.trim(),
          pin: formData.pin.trim(),
          avatarType: formData.avatarType,
          avatarValue: formData.avatarValue
        });
        state.activeAccountId = accountId;
        closeModal();
        showToast(`Welcome aboard, ${formData.displayName}!`, "success");
        render();
      } catch (err) {
        console.error(err);
        showToast("Failed to save profile: " + err.message, "error");
      }
    }

    async function handleBankHeadDeductFunds(targetAccountId, amount, reason, passkeyInput) {
      const bankHead = state.accounts.bank_head;
      if (passkeyInput !== bankHead.passkey) {
        showToast("Invalid Bank Head passkey. Authorization denied.", "error");
        return false;
      }
      const val = parseFloat(amount);
      if (isNaN(val) || val <= 0) {
        showToast("Enter a valid positive INR deduction amount.", "error");
        return false;
      }

      const target = state.accounts[targetAccountId];
      if (!target) return false;
      if (target.balance < val) {
        showToast(`${target.displayName} has insufficient balance (${formatINR(target.balance)}) for this deduction.`, "error");
        return false;
      }

      const deductionReason = reason.trim() || 'Bank Head Administrative Deduction';

      try {
        const batch = writeBatch(db);
        // Deduct from target banker's balance
        batch.update(getPublicDocRef('hfb_accounts', targetAccountId), {
          balance: Number((target.balance - val).toFixed(2))
        });
        await batch.commit();

        // Log deduction transaction
        await logTransaction({
          type: 'ADMIN_DEDUCTION',
          fromId: targetAccountId,
          toId: 'bank_head',
          amount: val,
          note: `Deduction by Bank Head: ${deductionReason}`
        });

        // Forward a direct notification record into hfb_requests / notification feed for the device user
        await addDoc(getPublicCollectionRef('hfb_requests'), {
          type: 'ADMIN_NOTIFICATION',
          fromId: 'bank_head',
          toId: targetAccountId,
          amount: val,
          note: `⚠️ Amount Deducted by Bank Head (${formatINR(val)}): ${deductionReason}`,
          status: 'acknowledged',
          createdAt: new Date().toISOString()
        });

        // Also post an alert message in the group chat for complete visibility
        await addDoc(getPublicCollectionRef('hfb_messages'), {
          senderId: 'bank_head',
          type: 'text',
          text: `🔔 [BANK HEAD DEDUCTION] Deducted ${formatINR(val)} from ${target.displayName}. Reason: ${deductionReason}`,
          createdAt: new Date().toISOString()
        });

        showToast(`Successfully deducted ${formatINR(val)} from ${target.displayName} and forwarded device notification!`, "success");
        return true;
      } catch (err) {
        console.error(err);
        showToast("Deduction error: " + err.message, "error");
        return false;
      }
    }

      if (fromId === toId) {
        showToast("Source and destination accounts must be different.", "error");
        return false;
      }
      const val = parseFloat(amount);
      if (isNaN(val) || val <= 0) {
        showToast("Enter a valid positive amount.", "error");
        return false;
      }
      const source = state.accounts[fromId];
      const dest = state.accounts[toId];
      if (!source || !dest) return false;
      if (source.balance < val) {
        showToast(`${source.displayName} has insufficient funds (${formatINR(source.balance)}).`, "error");
        return false;
      }

      try {
        const batch = writeBatch(db);
        batch.update(getPublicDocRef('hfb_accounts', fromId), {
          balance: Number((source.balance - val).toFixed(2))
        });
        batch.update(getPublicDocRef('hfb_accounts', toId), {
          balance: Number((dest.balance + val).toFixed(2))
        });
        await batch.commit();

        await logTransaction({
          type: 'REALLOCATION',
          fromId,
          toId,
          amount: val,
          note: `Admin Fund Reallocation: ${source.displayName} → ${dest.displayName}`
        });

        showToast(`Reallocated ${formatINR(val)} from ${source.displayName} to ${dest.displayName}`, "success");

    async function handleCreditCardSpend(accountId, amount, merchant) {
      const acc = state.accounts[accountId];
      if (!acc || !acc.creditCard || acc.creditCard.status !== 'active') return;
      const val = parseFloat(amount);
      if (isNaN(val) || val <= 0) {
        showToast("Enter a valid spend amount.", "error");
        return;
      }
      const available = acc.creditCard.limit - acc.creditCard.used;
      if (val > available) {
        showToast(`Exceeds available credit limit (${formatINR(available)}).`, "error");
        return;
      }

      const pointsEarned = Math.max(1, Math.floor(val / 25));

      try {
        await updateDoc(getPublicDocRef('hfb_accounts', accountId), {
          'creditCard.used': Number((acc.creditCard.used + val).toFixed(2)),
          rewardPoints: (acc.rewardPoints || 0) + pointsEarned
        });

        await logTransaction({
          type: 'CREDIT_SPEND',
          fromId: accountId,
          toId: 'merchant',
          amount: val,
          note: `Credit Card Spend: ${merchant.trim() || 'POS Purchase'} (+${pointsEarned} pts)`
        });

        showToast(`Paid ${formatINR(val)} via Credit Card · Earned +${pointsEarned} Reward Pts!`, "success");
      } catch (err) {
        console.error(err);
        showToast("Transaction failed: " + err.message, "error");
      }
    }

    async function handleResolveRequest(requestId, decision, approvedLimitOverride = null) {
      const req = state.requests.find(r => r.id === requestId);
      if (!req || req.status !== 'pending') return;

      const resolverId = state.activeAccountId;
      const resolver = state.accounts[resolverId];
      if (!resolver) return;

      try {
        if (decision === 'declined') {
          await updateDoc(getPublicDocRef('hfb_requests', requestId), {
            status: 'declined',
            resolvedBy: resolverId,
            resolvedAt: new Date().toISOString()
          });

          if (req.type === 'GROUP_REQUEST') {
            const linkedMsg = state.messages.find(m => m.requestId === requestId);
            if (linkedMsg) {
              await updateDoc(getPublicDocRef('hfb_messages', linkedMsg.id), {
                status: 'declined'
              });
            }
          }

          showToast("Request declined.", "info");
          return;
        }

        if (req.type === 'CREDIT_CARD_APP') {
          const applicant = state.accounts[req.fromId];
          if (!applicant) return;
          const finalLimit = approvedLimitOverride ? parseFloat(approvedLimitOverride) : req.amount;
          if (isNaN(finalLimit) || finalLimit <= 0) {
            showToast("Invalid credit limit.", "error");
            return;
          }
          const randomVirtualCard = String(Math.floor(5000 + Math.random() * 4999));

          const batch = writeBatch(db);
          batch.update(getPublicDocRef('hfb_accounts', req.fromId), {
            creditCard: {
              status: 'active',
              limit: finalLimit,
              used: 0,
              cardNumber: randomVirtualCard,
              approvedAt: new Date().toISOString()
            }
          });
          batch.update(getPublicDocRef('hfb_requests', requestId), {
            status: 'approved',
            amount: finalLimit,
            resolvedBy: resolverId,
            resolvedAt: new Date().toISOString()
          });
          await batch.commit();

          await logTransaction({
            type: 'CREDIT_APPROVED',
            fromId: 'bank_head',
            toId: req.fromId,
            amount: finalLimit,
            note: `Virtual Credit Card Approved (Limit: ${formatINR(finalLimit)})`
          });

          showToast(`Approved Virtual Credit Card for ${applicant.displayName}!`, "success");
        }
        else if (req.type === 'POS_DEBIT') {
          const cardHolder = state.accounts[req.fromId];
          if (!cardHolder) return;
          if (cardHolder.balance < req.amount) {
            showToast(`${cardHolder.displayName} no longer has sufficient balance.`, "error");
            return;
          }

          const batch = writeBatch(db);
          batch.update(getPublicDocRef('hfb_accounts', req.fromId), {
            balance: Number((cardHolder.balance - req.amount).toFixed(2))
          });
          batch.update(getPublicDocRef('hfb_requests', requestId), {
            status: 'approved',
            resolvedBy: resolverId,
            resolvedAt: new Date().toISOString()
          });
          await batch.commit();

          await logTransaction({
            type: 'POS_DEBIT',
            fromId: req.fromId,
            toId: 'pos_terminal',
            amount: req.amount,
            note: `POS / ATM Approved: ${req.note}`
          });

          showToast(`Approved ${formatINR(req.amount)} POS debit for ${cardHolder.displayName}`, "success");
        }
        else if (req.type === 'P2P_REQUEST' || req.type === 'GROUP_REQUEST') {
          const requester = state.accounts[req.fromId];
          if (!requester) return;

          const isBankHeadPayingFromTreasury = resolver.isAdmin && resolver.balance < req.amount;
          if (!isBankHeadPayingFromTreasury && resolver.balance < req.amount) {
            showToast(`Insufficient balance (${formatINR(resolver.balance)}) to pay ${formatINR(req.amount)}.`, "error");
            return;
          }
          if (isBankHeadPayingFromTreasury && state.settings.treasuryReserve < req.amount) {
            showToast("Insufficient Treasury Reserve.", "error");
            return;
          }

          const batch = writeBatch(db);
          if (isBankHeadPayingFromTreasury) {
            batch.update(getPublicDocRef('hfb_settings', 'global'), {
              treasuryReserve: Number((state.settings.treasuryReserve - req.amount).toFixed(2))
            });
          } else {
            batch.update(getPublicDocRef('hfb_accounts', resolverId), {
              balance: Number((resolver.balance - req.amount).toFixed(2))
            });
          }

          batch.update(getPublicDocRef('hfb_accounts', req.fromId), {
            balance: Number((requester.balance + req.amount).toFixed(2))
          });

          batch.update(getPublicDocRef('hfb_requests', requestId), {
            status: 'approved',
            resolvedBy: resolverId,
            resolvedAt: new Date().toISOString()
          });
          await batch.commit();

          if (req.type === 'GROUP_REQUEST') {
            const linkedMsg = state.messages.find(m => m.requestId === requestId);
            if (linkedMsg) {
              await updateDoc(getPublicDocRef('hfb_messages', linkedMsg.id), {
                status: 'approved',
                paidBy: resolverId
              });
            }
          }

          await logTransaction({
            type: 'P2P_TRANSFER',
            fromId: isBankHeadPayingFromTreasury ? 'treasury' : resolverId,
            toId: req.fromId,
            amount: req.amount,
            note: `${req.note} (Paid by ${resolver.displayName})`
          });

          showToast(`Paid ${formatINR(req.amount)} to ${requester.displayName}!`, "success");
        }
      } catch (err) {
        console.error(err);
        showToast("Action failed: " + err.message, "error");
      }
    }

    // --- 7. NOTIFICATION FILTERING FOR ACTIVE USER ---
    function getPendingNotificationsForActiveUser() {
      const uid = state.activeAccountId;
      if (!uid) return [];
      return state.requests.filter(r => {
        if (r.status !== 'pending' && r.type !== 'ADMIN_NOTIFICATION') return false;
        if (r.type === 'ADMIN_NOTIFICATION') {
          return r.toId === uid;
        }
        if (r.fromId === uid) return false;
        if (r.toId === uid) return true;
        if (r.toId === 'ALL') return true;
        return false;
      });
    }

      });

      document.getElementById('setup-avatar-file').onchange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const size = 128;
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const minSide = Math.min(img.width, img.height);
            const sx = (img.width - minSide) / 2;
            const sy = (img.height - minSide) / 2;
            ctx.drawImage(img, sx, sy, minSide, minSide, 0, 0, size, size);
            document.getElementById('setup-avatar-url').value = canvas.toDataURL('image/jpeg', 0.8);
            showToast("Photo prepared for avatar!", "success");
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      };

        await saveAccountSetup(accountId, {

          cardNumber,

                </div>
              </form>
            </div>
          </div>

      const box = document.getElementById('chat-messages-box');
      if (box) box.scrollTop = box.scrollHeight;

      document.getElementById('close-chat-drawer').onclick = () => toggleChatDrawer(false);
      document.getElementById('toggle-ask-all-btn').onclick = () => {
        chatAskAllMode = !chatAskAllMode;
        renderChatDrawer();
      };

      document.querySelectorAll('.chat-pay-btn').forEach(btn => {
        btn.onclick = async () => {
          const reqId = btn.dataset.reqId;
          await handleResolveRequest(reqId, 'approved');
        };
      });

      document.getElementById('chat-form').onsubmit = async (e) => {
        e.preventDefault();
        const text = document.getElementById('chat-input').value;
        const amountEl = document.getElementById('chat-req-amount');
        const amount = amountEl ? amountEl.value : 0;

        const ok = await handleSendGroupMessage(uid, text, chatAskAllMode, amount);
        if (ok) {
          chatAskAllMode = false;
          renderChatDrawer();
        }
      };

                <p class="text-xs text-blue-950 mt-2">Real-time synced across all Hiremath family devices.</p>
              </div>
              <div class="mt-6 pt-4 border-t border-blue-100 flex items-center justify-between text-xs">
                <span class="text-blue-950">Account Status</span>
                <span class="px-2.5 py-1 rounded-full font-bold bg-emerald-50 text-emerald-800">Active · Verified</span>
              </div>
            </div>

            <div class="rounded-3xl p-6 text-white shadow-lg bg-gradient-to-br from-blue-900 via-blue-950 to-slate-900 relative overflow-hidden flex flex-col justify-between">
              <div class="absolute -right-8 -top-8 w-36 h-36 rounded-full bg-blue-500/20 blur-xl"></div>
              <div class="flex items-center justify-between relative z-10">
                <span class="text-xs font-bold tracking-widest uppercase text-blue-200">Hiremath Debit</span>
                <button type="button" id="banker-toggle-pin-btn" class="px-2.5 py-1 rounded-full bg-white/10 hover:bg-white/20 text-[11px] font-semibold transition">
                  ${isPinRevealed ? '🙈 Hide PIN' : '👁️ Show PIN'}
                </button>
              </div>

              <div class="my-5 relative z-10">
                <p class="text-[11px] uppercase tracking-wider text-blue-300">Terminal Card Number</p>
                <p class="text-2xl font-mono font-bold tracking-widest mt-0.5">•••• •••• •••• ${escapeHTML(acc.cardNumber)}</p>
              </div>

              <div class="flex items-end justify-between relative z-10 text-xs">
                <div>
                  <span class="text-[10px] uppercase text-blue-300 block">Cardholder</span>
                  <span class="font-bold tracking-wide">${escapeHTML(acc.displayName)}</span>
                </div>
                <div class="text-right">
                  <span class="text-[10px] uppercase text-blue-300 block">ATM PIN</span>
                  <span class="font-mono font-bold text-sm">${isPinRevealed ? escapeHTML(acc.pin) : '••••'}</span>
                </div>
              </div>
            </div>

            <div class="glass-card rounded-3xl p-6 shadow-xs flex flex-col justify-between">
              <div>
                <div class="flex items-center justify-between">
                  <span class="text-xs font-bold uppercase tracking-wider text-amber-700">Reward Points</span>
                  <span class="px-2.5 py-0.5 rounded-full text-[11px] font-bold bg-amber-100 text-amber-900">
                    1 Pt = ${formatINR(state.settings.rewardRate)}
                  </span>
                </div>
                <div class="flex items-baseline gap-2 mt-2">
                  <p class="text-3xl font-extrabold font-mono text-blue-950">${acc.rewardPoints || 0}</p>
                  <span class="text-xs font-bold text-blue-950">pts</span>
                </div>
                <p class="text-xs text-blue-950 mt-1">
                  Cash Redemption Value: <strong class="font-mono text-emerald-700">${formatINR(redeemableCash)}</strong>
                </p>
              </div>

              <button type="button" id="banker-redeem-btn" ${!acc.rewardPoints || acc.rewardPoints <= 0 ? 'disabled' : ''}
                      class="mt-5 w-full py-2.5 px-4 rounded-2xl text-xs font-bold transition ${acc.rewardPoints > 0 ? 'bg-amber-600 hover:bg-amber-700 text-white shadow-xs' : 'bg-blue-50 text-blue-950 cursor-not-allowed'}">
                🎁 Redeem Points for ${formatINR(redeemableCash)}
              </button>
            </div>
          </div>

          <div class="glass-card rounded-3xl p-6 shadow-xs">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-5">
              <div>
                <h2 class="text-lg font-extrabold text-blue-950">Virtual Credit Card & Rewards</h2>
                <p class="text-xs text-blue-950">Earn 1 Reward Point for every ₹25 spent on your family credit line.</p>
              </div>
              ${cc && cc.status === 'active' ? `
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-bold bg-blue-100 text-blue-900">
                  ● Active Credit Line
                </span>
              ` : ''}
            </div>

            ${cc && cc.status === 'active' ? `
              <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-center">
                <div class="rounded-3xl p-6 text-white shadow-lg bg-gradient-to-tr from-blue-700 via-sky-600 to-blue-900 flex flex-col justify-between min-h-[195px]">
                  <div class="flex items-center justify-between">
                    <span class="text-xs font-extrabold uppercase tracking-wider bg-white/20 px-2.5 py-1 rounded-full">Hiremath Platinum</span>
                    <span class="font-mono text-xs opacity-90">VC •••• ${escapeHTML(cc.cardNumber)}</span>
                  </div>
                  <div class="my-4">
                    <p class="text-[11px] uppercase text-white/80">Available Credit</p>
                    <p class="text-2xl sm:text-3xl font-extrabold font-mono">${formatINR(ccAvailable)}</p>
                  </div>
                  <div class="flex items-center justify-between text-xs border-t border-white/20 pt-3">
                    <span>Limit: <strong class="font-mono">${formatINR(cc.limit)}</strong></span>
                    <span>Dues: <strong class="font-mono">${formatINR(cc.used)}</strong></span>
                  </div>
                </div>

                <form id="cc-spend-form" class="p-4 rounded-2xl bg-blue-50/50 border border-blue-200/80 space-y-3">
                  <h3 class="text-sm font-extrabold text-blue-950">Simulate Card Spend</h3>
                  <div>
                    <label class="block text-xs font-semibold text-blue-900 mb-1">Merchant / Purpose</label>
                    <input type="text" id="cc-spend-merchant" required placeholder="e.g., Amazon, Book Store, Cafe"
                           class="w-full px-3 py-2 rounded-xl border border-blue-300 text-xs bg-white" />
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-blue-900 mb-1">Spend Amount (₹ INR)</label>
                    <input type="number" id="cc-spend-amount" required min="1" max="${ccAvailable}" step="0.01" placeholder="500.00"
                           class="w-full px-3 py-2 rounded-xl border border-blue-300 font-mono text-xs bg-white" />
                  </div>
                  <button type="submit" class="w-full py-2.5 rounded-xl font-bold text-xs text-white bg-blue-600 shadow-xs hover:bg-blue-700 transition">
                    Pay with Credit Card
                  </button>
                </form>

                <form id="cc-repay-form" class="p-4 rounded-2xl bg-blue-50/50 border border-blue-200/80 space-y-3">
                  <div class="flex items-center justify-between">
                    <h3 class="text-sm font-extrabold text-blue-950">Pay Card Bill</h3>
                    <span class="text-xs font-mono font-bold text-blue-600">Due: ${formatINR(cc.used)}</span>
                  </div>
                  <p class="text-xs text-blue-950">Repay dues directly from your main savings balance (${formatINR(acc.balance)}).</p>
                  <div>
                    <label class="block text-xs font-semibold text-blue-900 mb-1">Repayment Amount (₹ INR)</label>
                    <input type="number" id="cc-repay-amount" required min="1" max="${cc.used}" step="0.01" value="${cc.used > 0 ? cc.used : ''}" placeholder="0.00"
                           class="w-full px-3 py-2 rounded-xl border border-blue-300 font-mono text-xs bg-white" />
                  </div>
                  <button type="submit" ${cc.used <= 0 ? 'disabled' : ''}
                          class="w-full py-2.5 rounded-xl font-bold text-xs transition ${cc.used > 0 ? 'bg-blue-950 text-white hover:bg-blue-900' : 'bg-blue-100 text-blue-950 cursor-not-allowed'}">
                    Settle Bill from Balance
                  </button>
                </form>
              </div>
            ` : pendingCCApp ? `
              <div class="p-6 rounded-2xl bg-amber-50/70 border border-amber-200 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                  <span class="text-2xl">⏳</span>
                  <div>
                    <h3 class="text-sm font-extrabold text-amber-950">Credit Card Application Under Review</h3>
                    <p class="text-xs text-amber-900 mt-0.5">Requested Limit: <strong class="font-mono">${formatINR(pendingCCApp.amount)}</strong> · Reason: ${escapeHTML(pendingCCApp.note)}</p>
                  </div>
                </div>
                <span class="px-3 py-1 rounded-full text-xs font-bold bg-amber-200/80 text-amber-900">Awaiting Bank Head</span>
              </div>
            ` : `
              <form id="cc-apply-form" class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end bg-blue-50/50 p-5 rounded-2xl border border-blue-200/70">
                <div>
                  <label class="block text-xs font-semibold text-blue-900 mb-1">Desired Credit Limit (₹ INR)</label>
                  <input type="number" id="cc-apply-limit" required min="500" step="500" placeholder="10000"
                         class="w-full px-3.5 py-2.5 rounded-xl border border-blue-300 font-mono text-sm bg-white" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-blue-900 mb-1">Purpose / Reason</label>
                  <input type="text" id="cc-apply-reason" required placeholder="e.g., Online learning & emergencies"
                         class="w-full px-3.5 py-2.5 rounded-xl border border-blue-300 text-sm bg-white" />
                </div>
                <button type="submit" class="py-2.5 px-5 rounded-xl font-bold text-sm text-white bg-blue-600 shadow-sm hover:bg-blue-700 transition">
                  Apply for Credit Card
                </button>
              </form>
            `}
          </div>

          ${renderTransactionLedger(uid)}
        </main>
      `;
    }

    function renderTransactionLedger(filterAccountId) {
      const txs = filterAccountId
        ? state.transactions.filter(t => t.fromId === filterAccountId || t.toId === filterAccountId)
        : state.transactions;

      return `
        <div class="glass-card rounded-3xl p-6 shadow-xs">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-base font-extrabold text-blue-950">${filterAccountId ? 'My Transaction History' : 'Live Family Ledger'}</h3>
            <span class="text-xs font-semibold text-blue-950">${txs.length} record${txs.length === 1 ? '' : 's'}</span>
          </div>

          ${txs.length === 0 ? `
            <div class="py-8 text-center text-xs text-blue-950 bg-blue-50/50 rounded-2xl border border-dashed border-blue-200">
              No transactions recorded yet. Activity will sync here in real time.
            </div>
          ` : `
            <div class="divide-y divide-blue-100">
              ${txs.slice(0, 15).map(tx => {
                const isIncoming = filterAccountId && tx.toId === filterAccountId;
                const isOutgoing = filterAccountId && tx.fromId === filterAccountId;
                return `
                  <div class="py-3 flex items-center justify-between gap-3">
                    <div class="min-w-0">
                      <p class="text-sm font-bold text-blue-950 truncate">${escapeHTML(tx.note)}</p>
                      <p class="text-[11px] text-blue-950 mt-0.5">${formatTime(tx.createdAt)}</p>
                    </div>
                    <span class="font-mono text-sm font-extrabold shrink-0 ${isIncoming ? 'text-emerald-700' : isOutgoing ? 'text-blue-950' : 'text-blue-900'}">
                      ${isIncoming ? '+' : isOutgoing ? '-' : ''}${formatINR(tx.amount)}
                    </span>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    function renderTerminalView() {
      const session = state.terminalSession;
      const authedAcc = session.authenticatedAccountId ? state.accounts[session.authenticatedAccountId] : null;

      return `
        <main class="flex-1 max-w-xl w-full mx-auto px-4 py-8 sm:py-12 flex flex-col justify-center">
          <div class="rounded-3xl bg-blue-950 text-white p-6 sm:p-8 shadow-2xl border border-blue-900 relative overflow-hidden">
            <div class="absolute -top-16 -right-16 w-48 h-48 rounded-full bg-blue-500/20 blur-2xl"></div>

            <div class="flex items-center justify-between border-b border-blue-900 pb-4 mb-6 relative z-10">
              <div class="flex items-center gap-2.5">
                <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="font-mono text-xs font-bold uppercase tracking-widest text-blue-200">Hiremath ATM / POS Terminal</span>
              </div>
              <button type="button" id="terminal-exit-btn" class="text-xs font-bold text-blue-300 hover:text-white transition">Exit ✕</button>
            </div>

            ${!authedAcc ? `
              <div class="relative z-10">
                <h2 class="text-xl sm:text-2xl font-extrabold mb-1">Insert Virtual Card</h2>
                <p class="text-xs text-blue-300 mb-6">Enter any family member's 4-digit Card Number and 4-digit PIN.</p>

                <form id="terminal-auth-form" class="space-y-4">
                  <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-blue-300 mb-1.5">4-Digit Card Number</label>
                    <input type="text" id="term-card-num" required pattern="\\d{4}" maxlength="4" inputmode="numeric" placeholder="e.g., 2002"
                           class="w-full px-4 py-3.5 rounded-2xl bg-blue-900 border border-blue-800 font-mono text-lg tracking-widest text-white focus:outline-none focus:border-blue-400" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-blue-300 mb-1.5">4-Digit Security PIN</label>
                    <input type="password" id="term-pin-num" required pattern="\\d{4}" maxlength="4" inputmode="numeric" placeholder="••••"
                           class="w-full px-4 py-3.5 rounded-2xl bg-blue-900 border border-blue-800 font-mono text-lg tracking-widest text-white focus:outline-none focus:border-blue-400" />
                  </div>
                  <button type="submit" class="w-full py-3.5 rounded-2xl font-bold text-sm text-white bg-blue-600 shadow-lg hover:bg-blue-700 transition">
                    Authenticate Card
                  </button>
                </form>
              </div>
            ` : `
              <div class="relative z-10 space-y-6">
                <div class="p-4 rounded-2xl bg-blue-900 border border-blue-800 flex items-center justify-between">
                  <div class="flex items-center gap-3">
                    ${renderAvatar(authedAcc, 'w-11 h-11 text-xl')}
                    <div>
                      <p class="font-extrabold text-sm text-white">${escapeHTML(authedAcc.displayName)}</p>
                      <p class="font-mono text-xs text-blue-300">Card #${escapeHTML(authedAcc.cardNumber)}</p>
                    </div>
                  </div>
                  <div class="text-right">
                    <span class="text-[10px] uppercase text-blue-300 block">Live Balance</span>
                    <span class="font-mono text-lg font-extrabold text-emerald-400">${formatINR(authedAcc.balance)}</span>
                  </div>
                </div>

                <form id="terminal-debit-form" class="space-y-4">
                  <h3 class="text-sm font-bold text-blue-200">Initiate POS Debit / Cash Withdrawal</h3>
                  <div>
                    <label class="block text-xs font-semibold text-blue-300 mb-1">Amount (₹ INR)</label>
                    <input type="number" id="term-debit-amount" required min="1" max="${authedAcc.balance}" step="0.01" placeholder="500.00"
                           class="w-full px-4 py-3 rounded-2xl bg-blue-900 border border-blue-800 font-mono text-base text-white focus:outline-none focus:border-blue-400" />
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-blue-300 mb-1">Merchant / Terminal Location</label>
                    <input type="text" id="term-debit-merchant" required placeholder="e.g., Mall POS, Bookstore, Cash ATM"
                           class="w-full px-4 py-3 rounded-2xl bg-blue-900 border border-blue-800 text-sm text-white focus:outline-none focus:border-blue-400" />
                  </div>
                  <p class="text-[11px] text-blue-200 bg-blue-800/50 border border-blue-700/50 rounded-xl p-3">
                    ℹ️ POS debits are routed to the Bank Head's Notification Center for real-time approval before funds are deducted.
                  </p>
                  <div class="flex gap-3 pt-1">
                    <button type="button" id="terminal-eject-btn" class="px-4 py-3 rounded-2xl text-xs font-bold bg-blue-900 hover:bg-blue-800 text-blue-200 transition">
                      Eject Card
                    </button>
                    <button type="submit" class="flex-1 py-3 rounded-2xl font-bold text-sm text-white bg-blue-600 shadow-lg hover:bg-blue-700 transition">
                      Submit POS Debit
                    </button>
                  </div>
                </form>
              </div>
            `}
          </div>
        </main>
      `;
    }

    // --- 11. MAIN RENDER & EVENT BINDING ---
    function render() {
      const appEl = document.getElementById('app');
      if (!appEl) return;

      if (!state.isCloudReady) return;

      let contentHTML = '';
      if (state.viewMode === 'terminal') {
        contentHTML = renderTerminalView();
      } else if (!state.activeAccountId) {
        contentHTML = renderLandingScreen();
      } else if (state.activeAccountId === 'bank_head') {
        contentHTML = renderBankHeadDashboard();
      } else {
        contentHTML = renderBankerDashboard();
      }

      appEl.innerHTML = `
        ${renderTopNav()}
        ${contentHTML}
      `;

      bindEvents();
    }

    function bindEvents() {
      const homeBtn = document.getElementById('nav-home-btn');
      if (homeBtn) {
        homeBtn.onclick = () => {
          state.viewMode = 'portal';
          render();
        };
      }

      const termBtn = document.getElementById('nav-terminal-btn');
      if (termBtn) {
        termBtn.onclick = () => {
          state.viewMode = state.viewMode === 'terminal' ? 'portal' : 'terminal';
          render();
        };
      }

      const switchBtn = document.getElementById('nav-switch-user-btn');
      if (switchBtn) {
        switchBtn.onclick = () => {
          state.activeAccountId = null;
          state.viewMode = 'portal';
          state.isNotifOpen = false;
          state.isChatOpen = false;
          document.getElementById('drawer-root').innerHTML = '';
          render();
        };
      }

      const notifBtn = document.getElementById('nav-notif-btn');
      if (notifBtn) notifBtn.onclick = () => toggleNotifDrawer();

      const chatBtn = document.getElementById('nav-chat-btn');
      if (chatBtn) chatBtn.onclick = () => toggleChatDrawer();

      const navDemoBtn = document.getElementById('nav-demo-btn');
      if (navDemoBtn) navDemoBtn.onclick = openDemoSettingsModal;

      document.querySelectorAll('.account-select-card').forEach(card => {
        card.onclick = () => openAccountEntryModal(card.dataset.accountId);
      });

      const adminP2P = document.getElementById('admin-p2p-btn');
      if (adminP2P) adminP2P.onclick = openP2PRequestModal;

      const adminDemo = document.getElementById('admin-demo-btn');
      if (adminDemo) adminDemo.onclick = openDemoSettingsModal;

      document.querySelectorAll('.toggle-secret-btn').forEach(btn => {
        btn.onclick = () => {
          const targetId = btn.dataset.toggleSecret;
          state.revealedSecrets[targetId] = !state.revealedSecrets[targetId];
          render();
        };
      });

      const addFundsForm = document.getElementById('admin-add-funds-form');
      if (addFundsForm) {
        addFundsForm.onsubmit = async (e) => {
          e.preventDefault();
          const target = document.getElementById('add-funds-target').value;
          const amount = document.getElementById('add-funds-amount').value;
          const passkey = document.getElementById('add-funds-passkey').value;
          const ok = await handleAddFundsFromTreasury(target, amount, passkey);
          if (ok) addFundsForm.reset();
        };
      }

      // Bank Head Deduct Funds Form Binding
      const deductForm = document.getElementById('admin-deduct-form');
      if (deductForm) {
        deductForm.onsubmit = async (e) => {
          e.preventDefault();
          const target = document.getElementById('deduct-target').value;
          const amount = document.getElementById('deduct-amount').value;
          const reason = document.getElementById('deduct-reason').value;
          const passkey = document.getElementById('deduct-passkey').value;
          const ok = await handleBankHeadDeductFunds(target, amount, reason, passkey);
          if (ok) deductForm.reset();
        };
      }

      const rateForm = document.getElementById('admin-rate-form');
      if (rateForm) {
        rateForm.onsubmit = async (e) => {
          e.preventDefault();
          const rate = document.getElementById('reward-rate-input').value;
          await handleUpdateRewardRate(rate);
        };
      }

      const bankerP2P = document.getElementById('banker-p2p-btn');
      if (bankerP2P) bankerP2P.onclick = openP2PRequestModal;

      const bankerChat = document.getElementById('banker-chat-btn');
      if (bankerChat) bankerChat.onclick = () => toggleChatDrawer(true);

      const bankerPinBtn = document.getElementById('banker-toggle-pin-btn');
      if (bankerPinBtn) {
        bankerPinBtn.onclick = () => {
          const uid = state.activeAccountId;
          state.revealedSecrets[uid] = !state.revealedSecrets[uid];
          render();
        };
      }

      const redeemBtn = document.getElementById('banker-redeem-btn');
      if (redeemBtn) {
        redeemBtn.onclick = () => handleRedeemRewards(state.activeAccountId);
      }

      const ccApplyForm = document.getElementById('cc-apply-form');
      if (ccApplyForm) {
        ccApplyForm.onsubmit = async (e) => {
          e.preventDefault();
          const limit = document.getElementById('cc-apply-limit').value;
          const reason = document.getElementById('cc-apply-reason').value;
          await handleApplyCreditCard(state.activeAccountId, limit, reason);
        };
      }

      const ccSpendForm = document.getElementById('cc-spend-form');
      if (ccSpendForm) {
        ccSpendForm.onsubmit = async (e) => {
          e.preventDefault();
          const merchant = document.getElementById('cc-spend-merchant').value;
          const amount = document.getElementById('cc-spend-amount').value;
          await handleCreditCardSpend(state.activeAccountId, amount, merchant);
          ccSpendForm.reset();
        };
      }

      const ccRepayForm = document.getElementById('cc-repay-form');
      if (ccRepayForm) {
        ccRepayForm.onsubmit = async (e) => {
          e.preventDefault();
          const amount = document.getElementById('cc-repay-amount').value;
          await handlePayCreditCardBill(state.activeAccountId, amount);
        };
      }

      const termExit = document.getElementById('terminal-exit-btn');
      if (termExit) {
        termExit.onclick = () => {
          state.viewMode = 'portal';
          render();
        };
      }

      const termAuthForm = document.getElementById('terminal-auth-form');
      if (termAuthForm) {
        termAuthForm.onsubmit = (e) => {
          e.preventDefault();
          const cardNum = document.getElementById('term-card-num').value.trim();
          const pinNum = document.getElementById('term-pin-num').value.trim();

          const matched = Object.values(state.accounts).find(
            a => a.isConfigured && a.cardNumber === cardNum && a.pin === pinNum
          );
          if (!matched) {
            showToast("Invalid 4-digit Card Number or PIN.", "error");
            return;
          }
          state.terminalSession.authenticatedAccountId = matched.id;
          showToast(`Card #${cardNum} authenticated (${matched.displayName})`, "success");
          render();
        };
      }

      const termEject = document.getElementById('terminal-eject-btn');
      if (termEject) {
        termEject.onclick = () => {
          state.terminalSession.authenticatedAccountId = null;
          render();
        };
      }

      const termDebitForm = document.getElementById('terminal-debit-form');
      if (termDebitForm) {
        termDebitForm.onsubmit = async (e) => {
          e.preventDefault();
          const amount = document.getElementById('term-debit-amount').value;
          const merchant = document.getElementById('term-debit-merchant').value;
          const ok = await handleCreatePOSDebit(state.terminalSession.authenticatedAccountId, amount, merchant);
          if (ok) termDebitForm.reset();
        };
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initFirebase();
    });
  </script>
</body>
</html>
