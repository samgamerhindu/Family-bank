    function formatINR(amount) {
      const num = Number(amount) || 0;
      return new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }).format(num);
    }

    function formatTime(isoString) {
      if (!isoString) return '';
      const date = new Date(isoString);
      return date.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) +
             ' · ' +
             date.toLocaleDateString('en-IN', { day: 'numeric', month: 'short' });
    }

    function escapeHTML(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

                 class="w-full h-full object-cover"
                 onerror="this.style.display='none'; this.parentElement.innerHTML='<span>${fallbackEmoji}</span>';" />

      return `

          <span>${escapeHTML(account.avatarValue || '👤')}</span>

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const styles = {
        success: 'bg-slate-900 text-white border-emerald-400/40',
        error: 'bg-rose-950 text-rose-50 border-rose-400/40',
        info: 'bg-slate-900 text-white border-pink-400/40'
      };
      const icons = {
        success: '✅',
        error: '⚠️',
        info: '✨'
      };

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-2xl shadow-xl border backdrop-blur-md text-sm font-medium transition-all duration-300 transform translate-y-2 opacity-0 ${styles[type] || styles.info}`;
      toast.innerHTML = `
        <span class="text-base">${icons[type] || icons.info}</span>
        <span class="flex-1 leading-snug">${escapeHTML(message)}</span>
      `;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-y-2', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('opacity-0', 'translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 3600);
    }

    function attachRealtimeListeners() {
      if (!currentUser || !db) return;

      onSnapshot(
        getPublicDocRef('hfb_settings', 'global'),
        (snap) => {
          if (snap.exists()) {
            state.settings = { ...state.settings, ...snap.data() };
            render();
          }
        },
        (err) => console.error("Settings listener error:", err)
      );

      onSnapshot(
        getPublicCollectionRef('hfb_accounts'),
        (snapshot) => {
          snapshot.forEach((docSnap) => {
            const data = docSnap.data();
            if (data && data.id) {
              state.accounts[data.id] = {
                ...state.accounts[data.id],
                ...data
              };
            }
          });
          state.isCloudReady = true;
          render();
        },
        (err) => console.error("Accounts listener error:", err)
      );

      onSnapshot(
        getPublicCollectionRef('hfb_requests'),
        (snapshot) => {
          const items = [];
          snapshot.forEach((docSnap) => {
            items.push({ id: docSnap.id, ...docSnap.data() });
          });
          items.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
          state.requests = items;
          render();
          if (state.isNotifOpen) renderNotifDrawer();
        },
        (err) => console.error("Requests listener error:", err)
      );

      onSnapshot(
        getPublicCollectionRef('hfb_transactions'),

        },

    async function initFirebase() {
      try {
        app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          try {
            await signInWithCustomToken(auth, __initial_auth_token);
          } catch (tokenErr) {
            if (tokenErr.code === 'auth/custom-token-mismatch' || tokenErr.code === 'auth/invalid-custom-token') {
              await signInAnonymously(auth);
            } else {
              throw tokenErr;
            }
          }
        } else {
          await signInAnonymously(auth);
        }

        currentUser = auth.currentUser;
        if (!currentUser) {
          await new Promise((resolve) => {
            const unsub = onAuthStateChanged(auth, (user) => {
              if (user) {
                currentUser = user;
                unsub();
                resolve();
              }
            });
          });
        }

        await seedInitialDataIfNeeded();
        attachRealtimeListeners();
      } catch (err) {
        console.error("Firebase init failed:", err);
        showToast("Cloud connection error: " + err.message, "error");
        state.isCloudReady = true;
        render();
      }
    }

    async function handleCreditCardSpend(accountId, amount, merchant) {
      const acc = state.accounts[accountId];
      if (!acc || !acc.creditCard || acc.creditCard.status !== 'active') return;
      if (acc.isFrozen) {
        showToast("Account is frozen. Contact Bank Head to unlock spending.", "error");
        return;
      }
      const val = parseFloat(amount);
      if (isNaN(val) || val <= 0) {
        showToast("Enter a valid spend amount.", "error");
        return;
      }

      const interestRate = Number(state.settings.creditInterestRate) || 0;
      const interestFee = Number(((val * interestRate) / 100).toFixed(2));
      const totalPaybackCharge = Number((val + interestFee).toFixed(2));
      const available = Number((acc.creditCard.limit - acc.creditCard.used).toFixed(2));

      if (totalPaybackCharge > available) {
        showToast(`Total charge with ${interestRate}% interest (${formatINR(totalPaybackCharge)}) exceeds available credit (${formatINR(available)}).`, "error");
        return;
      }

      const pointsEarned = Math.max(1, Math.floor(val / 25));
      const prevPrincipal = acc.creditCard.principalUsed ?? acc.creditCard.used;
      const prevInterest = acc.creditCard.interestAccrued ?? 0;

      try {
        await updateDoc(getPublicDocRef('hfb_accounts', accountId), {
          'creditCard.used': Number((acc.creditCard.used + totalPaybackCharge).toFixed(2)),
          'creditCard.principalUsed': Number((prevPrincipal + val).toFixed(2)),
          'creditCard.interestAccrued': Number((prevInterest + interestFee).toFixed(2)),
          rewardPoints: (acc.rewardPoints || 0) + pointsEarned
        });

        await logTransaction({
          type: 'CREDIT_SPEND',
          fromId: accountId,
          toId: 'merchant',
          amount: val,
          note: `Credit Card Spend: ${merchant.trim() || 'POS Purchase'} (+${formatINR(interestFee)} @ ${interestRate}% interest, +${pointsEarned} pts)`
        });

        showToast(`Spent ${formatINR(val)} (+${formatINR(interestFee)} interest) · Earned +${pointsEarned} Pts!`, "success");
      } catch (err) {
        console.error(err);
        showToast("Transaction failed: " + err.message, "error");
      }
    }

        await logTransaction({

    async function handleResolveRequest(requestId, decision, approvedLimitOverride = null) {
      const req = state.requests.find(r => r.id === requestId);
      if (!req || req.status !== 'pending') return;

      const resolverId = state.activeAccountId;
      const resolver = state.accounts[resolverId];
      if (!resolver) return;

      try {
        if (decision === 'declined') {
          await updateDoc(getPublicDocRef('hfb_requests', requestId), {
            status: 'declined',
            resolvedBy: resolverId,
            resolvedAt: new Date().toISOString()
          });

          if (req.type === 'GROUP_REQUEST') {
            const linkedMsg = state.messages.find(m => m.requestId === requestId);
            if (linkedMsg) {
              await updateDoc(getPublicDocRef('hfb_messages', linkedMsg.id), {
                status: 'declined'
              });
            }
          }

          showToast("Request declined.", "info");
          return;
        }

        if (req.type === 'CREDIT_CARD_APP') {
          const applicant = state.accounts[req.fromId];
          if (!applicant) return;
          const finalLimit = approvedLimitOverride ? parseFloat(approvedLimitOverride) : req.amount;
          if (isNaN(finalLimit) || finalLimit <= 0) {
            showToast("Invalid credit limit.", "error");
            return;
          }
          const randomVirtualCard = String(Math.floor(5000 + Math.random() * 4999));

          const batch = writeBatch(db);
          batch.update(getPublicDocRef('hfb_accounts', req.fromId), {
            creditCard: {
              status: 'active',
              limit: finalLimit,
              used: 0,
              principalUsed: 0,
              interestAccrued: 0,
              cardNumber: randomVirtualCard,
              approvedAt: new Date().toISOString()
            }
          });
          batch.update(getPublicDocRef('hfb_requests', requestId), {
            status: 'approved',
            amount: finalLimit,
            resolvedBy: resolverId,
            resolvedAt: new Date().toISOString()
          });
          await batch.commit();

          await logTransaction({
            type: 'CREDIT_APPROVED',
            fromId: 'bank_head',
            toId: req.fromId,
            amount: finalLimit,
            note: `Virtual Credit Card Approved (Limit: ${formatINR(finalLimit)})`
          });

          showToast(`Approved Virtual Credit Card for ${applicant.displayName}!`, "success");
        }
        else if (req.type === 'POS_DEBIT') {
          const cardHolder = state.accounts[req.fromId];
          if (!cardHolder) return;
          if (cardHolder.balance < req.amount) {
            showToast(`${cardHolder.displayName} no longer has sufficient balance.`, "error");
            return;
          }

          const batch = writeBatch(db);
          batch.update(getPublicDocRef('hfb_accounts', req.fromId), {
            balance: Number((cardHolder.balance - req.amount).toFixed(2))
          });
          batch.update(getPublicDocRef('hfb_requests', requestId), {
            status: 'approved',
            resolvedBy: resolverId,
            resolvedAt: new Date().toISOString()
          });
          await batch.commit();

          await logTransaction({
            type: 'POS_DEBIT',
            fromId: req.fromId,
            toId: 'pos_terminal',
            amount: req.amount,
            note: `POS / ATM Approved: ${req.note}`
          });

          showToast(`Approved ${formatINR(req.amount)} POS debit for ${cardHolder.displayName}`, "success");
        }
        else if (req.type === 'P2P_REQUEST' || req.type === 'GROUP_REQUEST') {
          const requester = state.accounts[req.fromId];
          if (!requester) return;

          const isBankHeadPayingFromTreasury = resolver.isAdmin && resolver.balance < req.amount;
          if (!isBankHeadPayingFromTreasury && resolver.balance < req.amount) {
            showToast(`Insufficient balance (${formatINR(resolver.balance)}) to pay ${formatINR(req.amount)}.`, "error");
            return;
          }
          if (isBankHeadPayingFromTreasury && state.settings.treasuryReserve < req.amount) {
            showToast("Insufficient Treasury Reserve.", "error");
            return;
          }

          const batch = writeBatch(db);
          if (isBankHeadPayingFromTreasury) {
            batch.update(getPublicDocRef('hfb_settings', 'global'), {
              treasuryReserve: Number((state.settings.treasuryReserve - req.amount).toFixed(2))
            });
          } else {
            batch.update(getPublicDocRef('hfb_accounts', resolverId), {
              balance: Number((resolver.balance - req.amount).toFixed(2))
            });
          }

          batch.update(getPublicDocRef('hfb_accounts', req.fromId), {
            balance: Number((requester.balance + req.amount).toFixed(2))
          });

          batch.update(getPublicDocRef('hfb_requests', requestId), {
            status: 'approved',
            resolvedBy: resolverId,
            resolvedAt: new Date().toISOString()
          });
          await batch.commit();

          if (req.type === 'GROUP_REQUEST') {
            const linkedMsg = state.messages.find(m => m.requestId === requestId);
            if (linkedMsg) {
              await updateDoc(getPublicDocRef('hfb_messages', linkedMsg.id), {
                status: 'approved',
                paidBy: resolverId
              });
            }
          }

          await logTransaction({
            type: 'P2P_TRANSFER',
            fromId: isBankHeadPayingFromTreasury ? 'treasury' : resolverId,
            toId: req.fromId,
            amount: req.amount,
            note: `${req.note} (Paid by ${resolver.displayName})`
          });

          showToast(`Paid ${formatINR(req.amount)} to ${requester.displayName}!`, "success");
        }
      } catch (err) {
        console.error(err);
        showToast("Action failed: " + err.message, "error");
      }
    }

    // --- 7. NOTIFICATION FILTERING FOR ACTIVE USER ---
    function getPendingNotificationsForActiveUser() {
      const uid = state.activeAccountId;
      if (!uid) return [];
      return state.requests.filter(r => {
        if (r.status !== 'pending' && r.type !== 'ADMIN_NOTIFICATION') return false;
        if (r.type === 'ADMIN_NOTIFICATION') {
          return r.toId === uid;
        }
        if (r.fromId === uid) return false;
        if (r.toId === uid) return true;
        if (r.toId === 'ALL') return true;
        return false;
      });
    }

                    <p class="text-2xl sm:text-3xl font-extrabold font-mono">${formatINR(ccAvailable)}</p>
                  </div>
                  <div class="space-y-1 text-xs border-t border-white/25 pt-2.5">
                    <div class="flex justify-between">
                      <span class="text-white/85">Total Limit:</span>
                      <strong class="font-mono">${formatINR(cc.limit)}</strong>
                    </div>
                    <div class="flex justify-between">
                      <span class="text-white/85">Payback Due (incl. ${interestRate}%):</span>
                      <strong class="font-mono">${formatINR(cc.used)}</strong>
                    </div>
                  </div>
                </div>

                <!-- Take Out Cash from Credit Card -> Adds directly to Bank Balance -->
                <form id="cc-cash-advance-form" class="p-4 rounded-2xl bg-gradient-to-b from-orange-50/70 to-pink-50/70 border border-pink-200/80 flex flex-col justify-between space-y-3">
                  <div>
                    <div class="flex items-center justify-between mb-1">
                      <h3 class="text-sm font-extrabold text-slate-900">Take Out Cash to Bank</h3>
                      <span class="px-2 py-0.5 rounded-full text-[10px] font-bold bg-pink-100 text-pink-800">+${interestRate}% Int.</span>
                    </div>
                    <p class="text-[11px] text-slate-600 mb-2.5">Withdraw from your credit card directly into your Bank Balance.</p>
                    <div class="space-y-2">
                      <div>
                        <label class="block text-[11px] font-semibold text-slate-700 mb-0.5">Withdrawal Amount (₹)</label>
                        <input type="number" id="cc-advance-amount" required min="1" max="${ccAvailable}" step="0.01" placeholder="1000.00"
                               class="w-full px-3 py-2 rounded-xl border border-pink-300 font-mono text-xs bg-white" />
                      </div>
                      <div>
                        <label class="block text-[11px] font-semibold text-slate-700 mb-0.5">Reason / Note</label>
                        <input type="text" id="cc-advance-purpose" placeholder="e.g., Urgent wallet top-up"
                               class="w-full px-3 py-2 rounded-xl border border-pink-300 text-xs bg-white" />
                      </div>
                    </div>
                    <p id="cc-advance-preview" class="text-[11px] font-mono text-pink-800 mt-2 font-semibold">
                      Payback due: ₹0.00 (incl. ${interestRate}% interest)
                    </p>
                  </div>
                  <button type="submit" class="w-full py-2.5 rounded-xl font-bold text-xs text-white brand-gradient shadow-xs hover:opacity-95 transition">
                    Transfer to Bank Balance →
                  </button>
                </form>

                <!-- Credit Card Merchant Purchase -->
                <form id="cc-spend-form" class="p-4 rounded-2xl bg-slate-50 border border-slate-200/80 flex flex-col justify-between space-y-3">
                  <div>
                    <h3 class="text-sm font-extrabold text-slate-900 mb-1">Card Purchase Spend</h3>
                    <p class="text-[11px] text-slate-600 mb-2.5">Pay merchants & earn reward points (+${interestRate}% payback interest).</p>
                    <div class="space-y-2">
                      <div>
                        <label class="block text-[11px] font-semibold text-slate-700 mb-0.5">Merchant / Purpose</label>
                        <input type="text" id="cc-spend-merchant" required placeholder="e.g., Bookstore, Cafe"
                               class="w-full px-3 py-2 rounded-xl border border-slate-300 text-xs bg-white" />
                      </div>
                      <div>
                        <label class="block text-[11px] font-semibold text-slate-700 mb-0.5">Spend Amount (₹)</label>
                        <input type="number" id="cc-spend-amount" required min="1" max="${ccAvailable}" step="0.01" placeholder="500.00"
                               class="w-full px-3 py-2 rounded-xl border border-slate-300 font-mono text-xs bg-white" />
                      </div>
                    </div>
                  </div>
                  <button type="submit" class="w-full py-2.5 rounded-xl font-bold text-xs text-white bg-slate-900 hover:bg-slate-800 shadow-xs transition">
                    Pay with Credit Card
                  </button>
                </form>

                <!-- Pay Back Credit Card Bill (Principal + Interest) -->
                <form id="cc-repay-form" class="p-4 rounded-2xl bg-slate-50 border border-slate-200/80 flex flex-col justify-between space-y-3">
                  <div>
                    <div class="flex items-center justify-between mb-1">
                      <h3 class="text-sm font-extrabold text-slate-900">Pay Back Card Dues</h3>
                      <span class="text-xs font-mono font-bold text-pink-600">${formatINR(cc.used)}</span>
                    </div>
                    <p class="text-[11px] text-slate-600 mb-2">
                      Settle principal + ${interestRate}% interest from your Bank Balance (${formatINR(acc.balance)}).
                    </p>
                    ${(cc.principalUsed !== undefined && cc.interestAccrued !== undefined && cc.used > 0) ? `
                      <div class="p-2 rounded-xl bg-white border border-slate-200 text-[11px] font-mono space-y-0.5 mb-2">
                        <div class="flex justify-between text-slate-600"><span>Principal:</span><span>${formatINR(cc.principalUsed)}</span></div>
                        <div class="flex justify-between text-pink-700"><span>Interest (${interestRate}%):</span><span>${formatINR(cc.interestAccrued)}</span></div>
                      </div>
                    ` : ''}
                    <div>
                      <label class="block text-[11px] font-semibold text-slate-700 mb-0.5">Payback Amount (₹)</label>
                      <input type="number" id="cc-repay-amount" required min="1" max="${cc.used}" step="0.01" value="${cc.used > 0 ? cc.used : ''}" placeholder="0.00"
                             class="w-full px-3 py-2 rounded-xl border border-slate-300 font-mono text-xs bg-white" />
                    </div>
                  </div>
                  <button type="submit" ${cc.used <= 0 ? 'disabled' : ''}
                          class="w-full py-2.5 rounded-xl font-bold text-xs transition ${cc.used > 0 ? 'bg-emerald-600 text-white hover:bg-emerald-700 shadow-xs' : 'bg-slate-200 text-slate-400 cursor-not-allowed'}">
                    Pay Back from Balance
                  </button>
                </form>
              </div>
            ` : pendingCCApp ? `
              <div class="p-6 rounded-2xl bg-amber-50/80 border border-amber-200 flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="flex items-center gap-3">
                  <span class="text-2xl">⏳</span>
                  <div>
                    <h3 class="text-sm font-extrabold text-amber-950">Credit Card Application Under Review</h3>
                    <p class="text-xs text-amber-900 mt-0.5">Requested Limit: <strong class="font-mono">${formatINR(pendingCCApp.amount)}</strong> · Reason: ${escapeHTML(pendingCCApp.note)}</p>
                  </div>
                </div>
                <span class="px-3 py-1 rounded-full text-xs font-bold bg-amber-200/80 text-amber-900">Awaiting Bank Head</span>
              </div>
            ` : `
              <form id="cc-apply-form" class="grid grid-cols-1 md:grid-cols-3 gap-4 items-end bg-slate-50 p-5 rounded-2xl border border-slate-200/80">
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Desired Credit Limit (₹ INR)</label>
                  <input type="number" id="cc-apply-limit" required min="500" step="500" placeholder="10000"
                         class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 font-mono text-sm bg-white" />
                </div>
                <div>
                  <label class="block text-xs font-semibold text-slate-700 mb-1">Purpose / Reason</label>
                  <input type="text" id="cc-apply-reason" required placeholder="e.g., Online learning & emergencies"
                         class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm bg-white" />
                </div>
                <button type="submit" class="py-2.5 px-5 rounded-xl font-bold text-sm text-white brand-gradient shadow-sm hover:opacity-95 transition">
                  Apply for Credit Card
                </button>
              </form>
            `}
          </div>

          ${renderTransactionLedger(uid)}
        </main>
      `;
    }

    function renderTransactionLedger(filterAccountId) {
      const txs = filterAccountId
        ? state.transactions.filter(t => t.fromId === filterAccountId || t.toId === filterAccountId)
        : state.transactions;

      return `
        <div class="glass-card rounded-3xl p-6">
          <div class="flex items-center justify-between mb-4">
            <h3 class="text-base font-extrabold text-slate-900">${filterAccountId ? 'My Transaction History' : 'Live Family Ledger'}</h3>
            <span class="text-xs font-semibold text-slate-500">${txs.length} record${txs.length === 1 ? '' : 's'}</span>
          </div>

          ${txs.length === 0 ? `
            <div class="py-8 text-center text-xs text-slate-500 bg-slate-50 rounded-2xl border border-dashed border-slate-200">
              No transactions recorded yet. Activity will sync here in real time.
            </div>
          ` : `
            <div class="divide-y divide-slate-100">
              ${txs.slice(0, 15).map(tx => {
                const isIncoming = filterAccountId && tx.toId === filterAccountId;
                const isOutgoing = filterAccountId && tx.fromId === filterAccountId;
                return `
                  <div class="py-3 flex items-center justify-between gap-3">
                    <div class="min-w-0">
                      <p class="text-sm font-bold text-slate-900 truncate">${escapeHTML(tx.note)}</p>
                      <p class="text-[11px] text-slate-400 mt-0.5">${formatTime(tx.createdAt)}</p>
                    </div>
                    <span class="font-mono text-sm font-extrabold shrink-0 ${isIncoming ? 'text-emerald-700' : isOutgoing ? 'text-rose-700' : 'text-slate-900'}">
                      ${isIncoming ? '+' : isOutgoing ? '-' : ''}${formatINR(tx.amount)}
                    </span>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    function renderTerminalView() {
      const session = state.terminalSession;
      const authedAcc = session.authenticatedAccountId ? state.accounts[session.authenticatedAccountId] : null;

      return `
        <main class="flex-1 max-w-xl w-full mx-auto px-4 py-8 sm:py-12 flex flex-col justify-center">
          <div class="rounded-3xl bg-slate-950 text-white p-6 sm:p-8 shadow-2xl border border-slate-800 relative overflow-hidden">
            <div class="absolute -top-16 -right-16 w-48 h-48 rounded-full bg-pink-500/20 blur-2xl"></div>

            <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-6 relative z-10">
              <div class="flex items-center gap-2.5">
                <span class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></span>
                <span class="font-mono text-xs font-bold uppercase tracking-widest text-pink-200">Hiremath ATM / POS Terminal</span>
              </div>
              <button type="button" id="terminal-exit-btn" class="text-xs font-bold text-slate-400 hover:text-white transition">Exit ✕</button>
            </div>

            ${!authedAcc ? `
              <div class="relative z-10">
                <h2 class="text-xl sm:text-2xl font-extrabold mb-1">Insert Virtual Card</h2>
                <p class="text-xs text-slate-400 mb-6">Enter any family member's 4-digit Card Number and 4-digit PIN.</p>

                <form id="terminal-auth-form" class="space-y-4">
                  <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">4-Digit Card Number</label>
                    <input type="text" id="term-card-num" required pattern="\\d{4}" maxlength="4" inputmode="numeric" placeholder="e.g., 2002"
                           class="w-full px-4 py-3.5 rounded-2xl bg-slate-900 border border-slate-700 font-mono text-lg tracking-widest text-white focus:outline-none focus:border-pink-400" />
                  </div>
                  <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1.5">4-Digit Security PIN</label>
                    <input type="password" id="term-pin-num" required pattern="\\d{4}" maxlength="4" inputmode="numeric" placeholder="••••"
                           class="w-full px-4 py-3.5 rounded-2xl bg-slate-900 border border-slate-700 font-mono text-lg tracking-widest text-white focus:outline-none focus:border-pink-400" />
                  </div>
                  <button type="submit" class="w-full py-3.5 rounded-2xl font-bold text-sm text-white brand-gradient shadow-lg hover:opacity-95 transition">
                    Authenticate Card
                  </button>
                </form>
              </div>
            ` : `
              <div class="relative z-10 space-y-6">
                <div class="p-4 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-between">
                  <div class="flex items-center gap-3">
                    ${renderAvatar(authedAcc, 'w-11 h-11 text-xl')}
                    <div>
                      <p class="font-extrabold text-sm text-white">${escapeHTML(authedAcc.displayName)}</p>
                      <p class="font-mono text-xs text-slate-400">Card #${escapeHTML(authedAcc.cardNumber)}</p>
                    </div>
                  </div>
                  <div class="text-right">
                    <span class="text-[10px] uppercase text-slate-400 block">Live Balance</span>
                    <span class="font-mono text-lg font-extrabold text-emerald-400">${formatINR(authedAcc.balance)}</span>
                  </div>
                </div>

                <form id="terminal-debit-form" class="space-y-4">
                  <h3 class="text-sm font-bold text-pink-200">Initiate POS Debit / Cash Withdrawal</h3>
                  <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Amount (₹ INR)</label>
                    <input type="number" id="term-debit-amount" required min="1" max="${authedAcc.balance}" step="0.01" placeholder="500.00"
                           class="w-full px-4 py-3 rounded-2xl bg-slate-900 border border-slate-700 font-mono text-base text-white focus:outline-none focus:border-pink-400" />
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1">Merchant / Terminal Location</label>
                    <input type="text" id="term-debit-merchant" required placeholder="e.g., Mall POS, Bookstore, Cash ATM"
                           class="w-full px-4 py-3 rounded-2xl bg-slate-900 border border-slate-700 text-sm text-white focus:outline-none focus:border-pink-400" />
                  </div>
                  <p class="text-[11px] text-slate-300 bg-slate-900/90 border border-slate-800 rounded-xl p-3">
                    ℹ️ POS debits are routed to the Bank Head's Notification Center for real-time approval before funds are deducted.
                  </p>
                  <div class="flex gap-3 pt-1">
                    <button type="button" id="terminal-eject-btn" class="px-4 py-3 rounded-2xl text-xs font-bold bg-slate-900 hover:bg-slate-800 text-slate-300 transition">
                      Eject Card
                    </button>
                    <button type="submit" class="flex-1 py-3 rounded-2xl font-bold text-sm text-white brand-gradient shadow-lg hover:opacity-95 transition">
                      Submit POS Debit
                    </button>
                  </div>
                </form>
              </div>
            `}
          </div>
        </main>
      `;
    }

    // --- 11. MAIN RENDER & EVENT BINDING ---
    function render() {
      const appEl = document.getElementById('app');
      if (!appEl) return;

      if (!state.isCloudReady) return;

      let contentHTML = '';
      if (state.viewMode === 'terminal') {
        contentHTML = renderTerminalView();
      } else if (!state.activeAccountId) {
        contentHTML = renderLandingScreen();
      } else if (state.activeAccountId === 'bank_head') {
        contentHTML = renderBankHeadDashboard();
      } else {
        contentHTML = renderBankerDashboard();
      }

      appEl.innerHTML = `
        ${renderTopNav()}
        ${contentHTML}
      `;

      bindEvents();
    }

    function bindEvents() {
      const homeBtn = document.getElementById('nav-home-btn');
      if (homeBtn) {
        homeBtn.onclick = () => {
          state.viewMode = 'portal';
          render();
        };
      }

      const termBtn = document.getElementById('nav-terminal-btn');
      if (termBtn) {
        termBtn.onclick = () => {
          state.viewMode = state.viewMode === 'terminal' ? 'portal' : 'terminal';
          render();
        };
      }

      const navEditBtn = document.getElementById('nav-edit-profile-btn');
      if (navEditBtn && state.activeAccountId) {
        navEditBtn.onclick = () => openProfileSettingsModal(state.activeAccountId, true);
      }

      const switchBtn = document.getElementById('nav-switch-user-btn');
      if (switchBtn) {
        switchBtn.onclick = () => {
          state.activeAccountId = null;
          state.viewMode = 'portal';
          state.isNotifOpen = false;
          state.isChatOpen = false;
          document.getElementById('drawer-root').innerHTML = '';
          render();
        };
      }

      const notifBtn = document.getElementById('nav-notif-btn');
      if (notifBtn) notifBtn.onclick = () => toggleNotifDrawer();

      const chatBtn = document.getElementById('nav-chat-btn');
      if (chatBtn) chatBtn.onclick = () => toggleChatDrawer();

      const navDemoBtn = document.getElementById('nav-demo-btn');
      if (navDemoBtn) navDemoBtn.onclick = openDemoSettingsModal;

      document.querySelectorAll('.account-select-card').forEach(card => {
        card.onclick = () => openAccountEntryModal(card.dataset.accountId);
      });

      const adminEditBtn = document.getElementById('admin-edit-profile-btn');
      if (adminEditBtn) adminEditBtn.onclick = () => openProfileSettingsModal('bank_head', true);

      const adminP2P = document.getElementById('admin-p2p-btn');
      if (adminP2P) adminP2P.onclick = openP2PRequestModal;

      const adminDemo = document.getElementById('admin-demo-btn');
      if (adminDemo) adminDemo.onclick = openDemoSettingsModal;

      document.querySelectorAll('.toggle-secret-btn').forEach(btn => {
        btn.onclick = () => {
          const targetId = btn.dataset.toggleSecret;
          state.revealedSecrets[targetId] = !state.revealedSecrets[targetId];
          render();
        };
      });

      document.querySelectorAll('.freeze-account-btn').forEach(btn => {
        btn.onclick = () => handleToggleAccountFreeze(btn.dataset.freezeAccount);
      });

      const addFundsForm = document.getElementById('admin-add-funds-form');
      if (addFundsForm) {
        addFundsForm.onsubmit = async (e) => {
          e.preventDefault();
          const target = document.getElementById('add-funds-target').value;
          const amount = document.getElementById('add-funds-amount').value;
          const passkey = document.getElementById('add-funds-passkey').value;
          const ok = await handleAddFundsFromTreasury(target, amount, passkey);
          if (ok) addFundsForm.reset();
        };
      }

      const reallocateForm = document.getElementById('admin-reallocate-form');
      if (reallocateForm) {
        reallocateForm.onsubmit = async (e) => {
          e.preventDefault();
          const fromId = document.getElementById('reallocate-from').value;
          const toId = document.getElementById('reallocate-to').value;
          const amount = document.getElementById('reallocate-amount').value;
          const ok = await handleReallocateFunds(fromId, toId, amount);
          if (ok) reallocateForm.reset();
        };
      }

      const deductForm = document.getElementById('admin-deduct-form');
      if (deductForm) {
        deductForm.onsubmit = async (e) => {
          e.preventDefault();
          const target = document.getElementById('deduct-target').value;
          const amount = document.getElementById('deduct-amount').value;
          const reason = document.getElementById('deduct-reason').value;
          const passkey = document.getElementById('deduct-passkey').value;
          const ok = await handleBankHeadDeductFunds(target, amount, reason, passkey);
          if (ok) deductForm.reset();
        };
      }

      const interestForm = document.getElementById('admin-interest-form');
      if (interestForm) {
        interestForm.onsubmit = async (e) => {
          e.preventDefault();
          const rate = document.getElementById('credit-interest-input').value;
          await handleUpdateCreditInterestRate(rate);
        };
      }

      const rateForm = document.getElementById('admin-rate-form');
      if (rateForm) {
        rateForm.onsubmit = async (e) => {
          e.preventDefault();
          const rate = document.getElementById('reward-rate-input').value;
          await handleUpdateRewardRate(rate);
        };
      }

      const bankerEditBtn = document.getElementById('banker-edit-profile-btn');
      if (bankerEditBtn) bankerEditBtn.onclick = () => openProfileSettingsModal(state.activeAccountId, true);

      const bankerGoalBtn = document.getElementById('banker-edit-goal-btn');
      if (bankerGoalBtn) bankerGoalBtn.onclick = openSavingsGoalModal;

      const bankerP2P = document.getElementById('banker-p2p-btn');
      if (bankerP2P) bankerP2P.onclick = openP2PRequestModal;

      const bankerChat = document.getElementById('banker-chat-btn');
      if (bankerChat) bankerChat.onclick = () => toggleChatDrawer(true);

      const bankerPinBtn = document.getElementById('banker-toggle-pin-btn');
      if (bankerPinBtn) {
        bankerPinBtn.onclick = () => {
          const uid = state.activeAccountId;
          state.revealedSecrets[uid] = !state.revealedSecrets[uid];
          render();
        };
      }

      const redeemBtn = document.getElementById('banker-redeem-btn');
      if (redeemBtn) {
        redeemBtn.onclick = () => handleRedeemRewards(state.activeAccountId);
      }

      const ccApplyForm = document.getElementById('cc-apply-form');
      if (ccApplyForm) {
        ccApplyForm.onsubmit = async (e) => {
          e.preventDefault();
          const limit = document.getElementById('cc-apply-limit').value;
          const reason = document.getElementById('cc-apply-reason').value;
          await handleApplyCreditCard(state.activeAccountId, limit, reason);
        };
      }

      const ccAdvanceInput = document.getElementById('cc-advance-amount');
      const ccAdvancePreview = document.getElementById('cc-advance-preview');
      if (ccAdvanceInput && ccAdvancePreview) {
        ccAdvanceInput.oninput = () => {
          const val = parseFloat(ccAdvanceInput.value) || 0;
          const rate = Number(state.settings.creditInterestRate || 0);
          const total = val + (val * rate) / 100;
          ccAdvancePreview.textContent = `Payback due: ${formatINR(total)} (incl. ${rate}% interest)`;
        };
      }

      const ccAdvanceForm = document.getElementById('cc-cash-advance-form');
      if (ccAdvanceForm) {
        ccAdvanceForm.onsubmit = async (e) => {
          e.preventDefault();
          const amount = document.getElementById('cc-advance-amount').value;
          const purpose = document.getElementById('cc-advance-purpose').value;
          const ok = await handleCreditCardCashAdvance(state.activeAccountId, amount, purpose);
          if (ok) ccAdvanceForm.reset();
        };
      }

      const ccSpendForm = document.getElementById('cc-spend-form');
      if (ccSpendForm) {
        ccSpendForm.onsubmit = async (e) => {
          e.preventDefault();
          const merchant = document.getElementById('cc-spend-merchant').value;
          const amount = document.getElementById('cc-spend-amount').value;
          await handleCreditCardSpend(state.activeAccountId, amount, merchant);
          ccSpendForm.reset();
        };
      }

      const ccRepayForm = document.getElementById('cc-repay-form');
      if (ccRepayForm) {
        ccRepayForm.onsubmit = async (e) => {
          e.preventDefault();
          const amount = document.getElementById('cc-repay-amount').value;
          await handlePayCreditCardBill(state.activeAccountId, amount);
        };
      }

      const termExit = document.getElementById('terminal-exit-btn');
      if (termExit) {
        termExit.onclick = () => {
          state.viewMode = 'portal';
          render();
        };
      }

      const termAuthForm = document.getElementById('terminal-auth-form');
      if (termAuthForm) {
        termAuthForm.onsubmit = (e) => {
          e.preventDefault();
          const cardNum = document.getElementById('term-card-num').value.trim();
          const pinNum = document.getElementById('term-pin-num').value.trim();

          const matched = Object.values(state.accounts).find(
            a => a.isConfigured && a.cardNumber === cardNum && a.pin === pinNum
          );
          if (!matched) {
            showToast("Invalid 4-digit Card Number or PIN.", "error");
            return;
          }
          state.terminalSession.authenticatedAccountId = matched.id;
          showToast(`Card #${cardNum} authenticated (${matched.displayName})`, "success");
          render();
        };
      }

      const termEject = document.getElementById('terminal-eject-btn');
      if (termEject) {
        termEject.onclick = () => {
          state.terminalSession.authenticatedAccountId = null;
          render();
        };
      }

      const termDebitForm = document.getElementById('terminal-debit-form');
      if (termDebitForm) {
        termDebitForm.onsubmit = async (e) => {
          e.preventDefault();
          const amount = document.getElementById('term-debit-amount').value;
          const merchant = document.getElementById('term-debit-merchant').value;
          const ok = await handleCreatePOSDebit(state.terminalSession.authenticatedAccountId, amount, merchant);
          if (ok) termDebitForm.reset();
        };
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      initFirebase();
    });
  </script>
</body>
</html>
